<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Rocks Validator (Cloud R2 Edition)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121214;
            color: #e1e1e6;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #202024;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #323238;
        }
        h1 {
            font-size: 1.2rem;
            color: #e1e1e6;
        }
        .user-badge {
            font-size: 0.85rem;
            color: #a8a8b3;
            background: #29292e;
            padding: 6px 12px;
            border-radius: 4px;
        }
        .main-container {
            display: flex;
            flex: 1;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        /* Modal / Pop-up Tasarımı */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-card {
            background-color: #202024;
            border: 1px solid #323238;
            border-radius: 8px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-card h2 {
            margin-bottom: 15px;
            font-size: 1.4rem;
            color: #e5484d;
            text-align: center;
        }
        .modal-card p {
            font-size: 0.85rem;
            color: #a8a8b3;
            margin-bottom: 20px;
            text-align: center;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #c4c4cc;
        }
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            background-color: #121214;
            border: 1px solid #323238;
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: #e5484d;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #e5484d;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-submit:hover {
            background-color: #f2555a;
        }
        #loadingState {
            display: none;
            text-align: center;
            color: #a8a8b3;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌙 Moon Rocks Validator (Cloud R2 Edition)</h1>
        <div id="currentUserBadge" class="user-badge">Kullanıcı: Giriş yapılmadı</div>
    </header>

    <div class="main-container">
        <div id="loadingState">
            <p>Cloudflare R2 verileri yükleniyor, lütfen bekleyin...</p>
        </div>
    </div>

    <!-- Giriş Modalı -->
    <div id="loginModal" class="modal-overlay">
        <div class="modal-card">
            <h2>🌙 Moon Rocks Validator</h2>
            <p>Lütfen adınızı ve incelemek istediğiniz Veri Paketini (JSON) seçin.</p>
            <div class="form-group">
                <input type="text" id="userNameInput" placeholder="Ad Soyad giriniz..." value="shima rahimi">
            </div>
            <div class="form-group">
                <label for="jsonPackageSelect">Çalışılacak Paket Verisi:</label>
                <select id="jsonPackageSelect">
                    <option value="Paket_2_data_1.json">Paket 2 (Data 1)</option>
                    <option value="Paket_1_data_1.json">Paket 1 (Data 1)</option>
                </select>
            </div>
            <button class="btn-submit" onclick="handleUserLogin()">Sisteme Giriş Yap ve Yükle →</button>
        </div>
    </div>

    <script>
        // TEK VE NET DEĞİŞKEN TANIMI (Hata almamak için sadece 1 tane olmalı)
        const CLOUDFLARE_BASE_URL = "https://pub-bc527cfeccef44c985ef3a628ce42cd7.r2.dev";

        let loggedInUser = "";
        let metadata = null;

        async function handleUserLogin() {
            const inputVal = document.getElementById('userNameInput').value.trim();
            const selectedPackage = document.getElementById('jsonPackageSelect').value;

            if (!inputVal) {
                alert('Lütfen geçerli bir ad ve soyad girin!');
                return;
            }
            
            loggedInUser = inputVal;
            
            // Kullanıcı rozetini güncelle
            const userBadge = document.getElementById('currentUserBadge');
            if (userBadge) userBadge.textContent = `Kullanıcı: ${loggedInUser}`;
            
            // Modalı gizle ve yükleniyor yazısını göster
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('loadingState').style.display = 'block';

            // Dinamik URL Oluşturma
            const jsonUrl = `${CLOUDFLARE_BASE_URL}/JSON_Ciktilari/${selectedPackage}`;
            
            try {
                // Cloudflare R2'den veri çekme
                const response = await fetch(jsonUrl, {
                    method: 'GET',
                    mode: 'cors'
                });

                if (!response.ok) {
                    throw new Error(`Veri indirilemedi! HTTP Kodu: ${response.status}`);
                }

                metadata = await response.json();
                
                // Yükleme tamamlandı
                document.getElementById('loadingState').style.display = 'none';
                
                if (typeof initializeUserData === 'function') {
                    initializeUserData();
                } else {
                    console.log("Veri başarıyla yüklendi:", metadata);
                }

            } catch (error) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('loginModal').style.display = 'flex';
                alert('JSON verisi yüklenirken hata oluştu: ' + error.message);
                console.error("Fetch Hatası:", error);
            }
        }

        function initializeUserData() {
            console.log("Sistem başarıyla aktif hale getirildi.");
        }
    </script>
</body>
</html>
