<div class="modal-overlay" id="liveReportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📊 Anlık Canlı Doğrulama Raporu</h3>
                <button class="close-modal" onclick="closeLiveReport()">✕</button>
            </div>
            <div class="modal-body" id="liveReportContent">Rapor yükleniyor...</div>
        </div>
    </div>

    <script>
        const scriptURL = "https://script.google.com/macros/s/AKfycbwpuV30CyooeJ6YvU6nc8-hJIyAXkHbbwu0WyjLyoP6o_Kcpg2qW3FNOK0BKbxnkck/exec";
        let metadata = null;
        let currentRockIndex = 0;
        let allRocks = [];
        let falseNegatives = {};
        const imageCache = {};
        let completeGlobalRocksList = []; 
        let completedRocksMap = {};
        let rockAnnotationsMap = {};

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                let localCompleted = localStorage.getItem('lunar_completed_rocks');
                if (localCompleted) {
                    try { JSON.parse(localCompleted).forEach(k => completedRocksMap[k] = true); } catch(e) {}
                }

                let localAnnotations = localStorage.getItem('lunar_rock_annotations');
                if (localAnnotations) {
                    try { rockAnnotationsMap = JSON.parse(localAnnotations); } catch(e) {}
                }

                try {
                    const sheetRes = await fetch(scriptURL);
                    const sheetData = await sheetRes.json();
                    if (Array.isArray(sheetData)) {
                        sheetData.forEach(row => {
                            if (row.imageName && row.rockId) {
                                let key = `${row.imageName}_${row.rockId}`;
                                completedRocksMap[key] = true;
                                if (row.annotation) {
                                    rockAnnotationsMap[key] = row.annotation.toLowerCase();
                                }
                            }
                        });
                        localStorage.setItem('lunar_completed_rocks', JSON.stringify(Object.keys(completedRocksMap)));
                        localStorage.setItem('lunar_rock_annotations', JSON.stringify(rockAnnotationsMap));
                    }
                } catch (e) {
                    console.warn("Google Sheets GET hatası:", e);
                }

                const response = await fetch('data.json');
                if (!response.ok) throw new Error('data.json dosyasına ulaşılamadı!');
                const parsedData = await response.json();

                metadata = parsedData;
                let imagesList = Object.keys(metadata);

                allRocks = [];
                completeGlobalRocksList = [];

                imagesList.forEach(imgName => {
                    let imgObj = metadata[imgName];
                    let rocksArray = imgObj.rocks || imgObj.annotations || imgObj.boxes || imgObj.objects || (Array.isArray(imgObj) ? imgObj : null);
                    
                    if (!rocksArray && typeof imgObj === 'object') {
                        let possibleKey = Object.keys(imgObj).find(k => Array.isArray(imgObj[k]));
                        if (possibleKey) rocksArray = imgObj[possibleKey];
                    }

                    if (rocksArray && Array.isArray(rocksArray)) {
                        rocksArray.forEach((rock, rockIdx) => {
                            let rId = rock.id || rock.rock_id || (rockIdx + 1);
                            let rockItem = { imageName: imgName, rockIndex: rockIdx, ...rock };
                            completeGlobalRocksList.push(rockItem);

                            let uniqueKey = `${imgName}_${rId}`;
                            if (rockAnnotationsMap[uniqueKey]) {
                                rockItem.annotation = rockAnnotationsMap[uniqueKey];
                                rockItem.validation_status = rockAnnotationsMap[uniqueKey];
                            }

                            if (!completedRocksMap[uniqueKey]) {
                                allRocks.push(rockItem);
                            }
                        });
                    }

                    if (!falseNegatives[imgName]) {
                        let rawFn = imgObj.false_negatives || imgObj.points || [];
                        falseNegatives[imgName] = rawFn.map(item => ({ x: item.x, y: item.y }));
                    }
                });

                populateImageSelector([...new Set(completeGlobalRocksList.map(r => r.imageName))]);

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'flex';
                document.getElementById('totalRocks').textContent = allRocks.length;
                currentRockIndex = 0;
                
                if (allRocks.length > 0) {
                    await displayCurrentRock();
                } else {
                    document.getElementById('status').textContent = '✓ Tüm taşlar doğrulanmış!';
                }
                document.getElementById('status').textContent = '✓ Hazır! Kalan taş: ' + allRocks.length;
            } catch (error) {
                alert('Yükleme hatası: ' + error.message);
            }
        });

        function resetLocalCache() {
            if (confirm("Hafızayı sıfırlamak istiyorsunuz. Emin misiniz?")) {
                localStorage.removeItem('lunar_completed_rocks');
                localStorage.removeItem('lunar_rock_annotations');
                location.reload();
            }
        }

        document.addEventListener('keydown', function(event) {
            const mainContent = document.getElementById('mainContent');
            if (!mainContent || mainContent.style.display === 'none') return;
            if (['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName)) return;

            if (event.key === 'Enter') { event.preventDefault(); annotateRock('yes'); }
            else if (event.key === 'Escape') { event.preventDefault(); annotateRock('no'); }
            else if (event.key === ' ') { event.preventDefault(); annotateRock('review'); }
            else if (event.key === 'ArrowLeft') { event.preventDefault(); previousRock(); }
            else if (event.key === 'ArrowRight') { event.preventDefault(); nextRock(); }
        });

        function populateImageSelector(imagesList) {
            const selector = document.getElementById('imageSelector');
            selector.innerHTML = '';
            imagesList.forEach(imgName => {
                const opt = document.createElement('option');
                opt.value = imgName;
                opt.textContent = imgName;
                selector.appendChild(opt);
            });
        }

        function updateRockShortcuts(currentImgName) {
            const container = document.getElementById('rockShortcutsContainer');
            container.innerHTML = '';
            const rocksOfImage = completeGlobalRocksList.filter(r => r.imageName === currentImgName);
            
            rocksOfImage.forEach((r) => {
                const chip = document.createElement('div');
                chip.className = 'rock-chip';
                let rId = r.id || r.rock_id || (r.rockIndex + 1);
                let uniqueKey = `${currentImgName}_${rId}`;
                
                if (completedRocksMap[uniqueKey]) chip.classList.add('completed');
                if (allRocks[currentRockIndex] && allRocks[currentRockIndex].imageName === currentImgName && (allRocks[currentRockIndex].id || allRocks[currentRockIndex].rock_id || (allRocks[currentRockIndex].rockIndex + 1)) === rId) {
                    chip.classList.add('active');
                }

                chip.textContent = `#${rId} (${rockAnnotationsMap[uniqueKey] ? rockAnnotationsMap[uniqueKey].toUpperCase() : '?'})`;
                chip.onclick = () => {
                    const targetIdx = allRocks.findIndex(item => item.imageName === currentImgName && (item.id || item.rock_id || (item.rockIndex + 1)) === rId);
                    if (targetIdx !== -1) { currentRockIndex = targetIdx; displayCurrentRock(); }
                };
                container.appendChild(chip);
            });
        }

        function onImageSelectorChange(imgName) {
            const targetIndex = allRocks.findIndex(r => r.imageName === imgName);
            if (targetIndex !== -1) {
                currentRockIndex = targetIndex;
                displayCurrentRock();
            }
        }

        async function displayCurrentRock() {
            if (!allRocks || allRocks.length === 0 || currentRockIndex >= allRocks.length) return;
            const rock = allRocks[currentRockIndex];
            const imgName = rock.imageName;

            document.getElementById('currentRockNum').textContent = currentRockIndex + 1;
            document.getElementById('currentImageName').textContent = imgName;
            document.getElementById('imageSelector').value = imgName;

            updateRockShortcuts(imgName);
            drawUnifiedView(imgName, rock);
            updateRockInfo(rock, imgName);
        }

        function tryLoadingImage(basePath, successCallback) {
            if (imageCache[basePath]) { successCallback(imageCache[basePath], basePath); return; }
            const candidateUrls = [basePath + ".jpg", basePath + ".JPG", basePath + ".png", basePath + ".PNG", basePath];
            let index = 0;
            function tryNext() {
                if (index >= candidateUrls.length) return;
                const img = new Image();
                img.onload = () => { imageCache[basePath] = img; successCallback(img, candidateUrls[index]); };
                img.onerror = () => { index++; tryNext(); };
                img.src = candidateUrls[index];
            }
            tryNext();
        }

        function drawUnifiedView(imageName, rock) {
            const canvas = document.getElementById('unifiedCanvas');
            const ctx = canvas.getContext('2d');
            let rawBasePath = "validation/" + imageName;

            tryLoadingImage(rawBasePath, function(mainImg) {
                canvas.width = mainImg.width;
                canvas.height = mainImg.height;
                canvas.style.width = mainImg.width + 'px';
                canvas.style.height = mainImg.height + 'px';
                ctx.drawImage(mainImg, 0, 0);

                if (falseNegatives[imageName]) {
                    falseNegatives[imageName].forEach((pt, idx) => {
                        ctx.fillStyle = '#ef4444';
                        ctx.beginPath();
                        ctx.arc(pt.x, pt.y, 5, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.strokeStyle = '#ffffff';
                        ctx.lineWidth = 1.5;
                        ctx.stroke();
                        ctx.fillStyle = '#ffffff';
                        ctx.font = 'bold 9px sans-serif';
                        ctx.fillText(idx + 1, pt.x + 8, pt.y - 4);
                    });
                }
               
                let sX = Math.round(rock.x || rock.xmin || rock.left || 0);
                let sY = Math.round(rock.y || rock.ymin || rock.top || 0);
                let sW = Math.round(rock.width || (rock.xmax - sX) || rock.w || 50);
                let sH = Math.round(rock.height || (rock.ymax - sY) || rock.h || 50);

                const contextScale = 3.0; 
                let expandW = sW * contextScale;
                let expandH = sH * contextScale;
                let cropX = Math.max(0, sX - (expandW - sW) / 2);
                let cropY = Math.max(0, sY - (expandH - sH) / 2);

                if (cropX + expandW > mainImg.width) cropX = mainImg.width - expandW;
                if (cropY + expandH > mainImg.height) cropY = mainImg.height - expandH;

                const popW = expandW * 1.5;
                const popH = expandH * 1.5;
                let popX1 = sX + sW + 25;
                let popY1 = sY - 10;
                if (popX1 + (popW * 2) + 40 > mainImg.width) popX1 = sX - (popW * 2) - 45;
                if (popY1 + popH + 20 > mainImg.height) popY1 = mainImg.height - popH - 20;

                let popX2 = popX1 + popW + 15;
                let popY2 = popY1;

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2;
                ctx.strokeRect(sX, sY, sW, sH);

                tryLoadingImage(rawBasePath, function(rawImg) {
                    ctx.drawImage(rawImg, cropX, cropY, expandW, expandH, popX1, popY1, popW, popH);
                    ctx.strokeStyle = '#3b82f6';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(popX1, popY1, popW, popH);
                    ctx.fillStyle = '#3b82f6';
                    ctx.font = '10px sans-serif';
                    ctx.fillText('RAW (Context)', popX1 + 4, popY1 + 12);

                    let outlinedBasePath = "validation/" + imageName + "_outlined";
                    tryLoadingImage(outlinedBasePath, function(outlinedImg) {
                        let scaleRatioX = popW / expandW;
                        let scaleRatioY = popH / expandH;
                        let relX = (sX - cropX) * scaleRatioX;
                        let relY = (sY - cropY) * scaleRatioY;
                        let relW = sW * scaleRatioX;
                        let relH = sH * scaleRatioY;

                        ctx.drawImage(outlinedImg, sX, sY, sW, sH, popX2 + relX, popY2 + relY, relW, relH);
                        ctx.strokeStyle = '#ef4444';
                        ctx.lineWidth = 1.5;
                        ctx.strokeRect(popX2, popY2, popW, popH);
                        ctx.fillStyle = '#ef4444';
                        ctx.font = '10px sans-serif';
                        ctx.fillText('OUTLINE (Target Only)', popX2 + 4, popY2 + 12);
                    });
                });
            });

            canvas.onclick = (e) => {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                const x = Math.round((e.clientX - rect.left) * scaleX);
                const y = Math.round((e.clientY - rect.top) * scaleY);
               
                if (!falseNegatives[imageName]) falseNegatives[imageName] = [];
                falseNegatives[imageName].push({ x: x, y: y });
                displayCurrentRock();
            };

            canvas.oncontextmenu = (e) => { e.preventDefault(); removeLastPoint(); };
        }

        function removeLastPoint() {
            if (!allRocks || allRocks.length === 0) return;
            const currentImageName = allRocks[currentRockIndex].imageName;
            if (falseNegatives[currentImageName] && falseNegatives[currentImageName].length > 0) {
                falseNegatives[currentImageName].pop();
                displayCurrentRock();
            }
        }

        function updateRockInfo(rock, imageName) {
            document.getElementById('rockId').textContent = rock.id || rock.rock_id || (currentRockIndex + 1);
            let x = Math.round(rock.x || rock.xmin || rock.left || 0);
            let y = Math.round(rock.y || rock.ymin || rock.top || 0);
            let w = Math.round(rock.width || (rock.xmax - x) || rock.w || 0);
            let h = Math.round(rock.height || (rock.ymax - y) || rock.h || 0);
            document.getElementById('rockCoords').textContent = `[${x}, ${y}]`;

            const statusEl = document.getElementById('annotationStatus');
            statusEl.className = 'annotation-status';
            const ann = rock.annotation || rock.validation_status;
            if (ann === 'yes') { statusEl.classList.add('status-yes'); statusEl.textContent = '✓ YES'; }
            else if (ann === 'no') { statusEl.classList.add('status-no'); statusEl.textContent = '✗ NO'; }
            else if (ann === 'review') { statusEl.classList.add('status-review'); statusEl.textContent = '⟳ REVIEW'; }
            else { statusEl.classList.add('status-pending'); statusEl.textContent = 'PENDING'; }
        }

        function annotateRock(value) {
            if (!allRocks || currentRockIndex >= allRocks.length) return;
            const rock = allRocks[currentRockIndex];
            let rId = rock.id || rock.rock_id || (rock.rockIndex + 1);
            let uniqueKey = `${rock.imageName}_${rId}`;
            
            completedRocksMap[uniqueKey] = true;
            rockAnnotationsMap[uniqueKey] = value;

            localStorage.setItem('lunar_completed_rocks', JSON.stringify(Object.keys(completedRocksMap)));
            localStorage.setItem('lunar_rock_annotations', JSON.stringify(rockAnnotationsMap));

            rock.annotation = value;
            rock.validation_status = value;
            
            allRocks.splice(currentRockIndex, 1);
            document.getElementById('totalRocks').textContent = allRocks.length;

            if (currentRockIndex >= allRocks.length && allRocks.length > 0) currentRockIndex = allRocks.length - 1;

            if (allRocks.length > 0) {
                displayCurrentRock();
            } else {
                document.getElementById('mainContent').innerHTML = '<div style="text-align:center; padding:50px; color:#22c55e; font-size:24px;">🎉 Tüm taşlar doğrulandı!</div>';
            }
        }

        async function submitToCloud() {
            let userName = prompt("Adınızı veya Rumuzunuzu girin:", "Anonim");
            if (!userName) return;

            document.getElementById('status').textContent = 'Veriler buluta gönderiliyor...';
            
            let recordsToSend = [];
            completeGlobalRocksList.forEach(rock => {
                let rId = rock.id || rock.rock_id || (rock.rockIndex + 1);
                let uniqueKey = `${rock.imageName}_${rId}`;
                let ann = rockAnnotationsMap[uniqueKey] || rock.annotation || rock.validation_status;
                
                if (completedRocksMap[uniqueKey] || (ann && ann !== 'pending')) {
                    let x = Math.round(rock.x || rock.xmin || rock.left || 0);
                    let y = Math.round(rock.y || rock.ymin || rock.top || 0);
                    
                    recordsToSend.push({
                        imageName: rock.imageName,
                        rockId: rId,
                        annotation: ann || 'yes',
                        user: userName,
                        bbox: [x, y],
                        outlines: falseNegatives[rock.imageName] || []
                    });
                }
            });

            if (recordsToSend.length === 0) {
                alert("Gönderilecek veri yok!");
                return;
            }

            document.getElementById('formPayload').value = JSON.stringify(recordsToSend);
            document.getElementById('cloudForm').submit();
            document.getElementById('status').textContent = '✓ Veriler buluta iletildi!';
            alert("Başarıyla kaydedildi!");
        }

        function nextRock() { if (currentRockIndex < allRocks.length - 1) { currentRockIndex++; displayCurrentRock(); } }
        function previousRock() { if (currentRockIndex > 0) { currentRockIndex--; displayCurrentRock(); } }

        function generateReportText() {
            let report = '';
            let rocksByImage = {};
            
            completeGlobalRocksList.forEach(rock => {
                if (!rocksByImage[rock.imageName]) rocksByImage[rock.imageName] = [];
                rocksByImage[rock.imageName].push(rock);
            });
            
            Object.keys(rocksByImage).forEach(imgName => {
                let theImgRocks = rocksByImage[imgName];
                report += `Image: ${imgName}\n`;
                report += `Total Model Rocks: ${theImgRocks.length}\n\n`;
                
                theImgRocks.forEach((rock, idx) => {
                    let rId = rock.id || rock.rock_id || (idx + 1);
                    let uniqueKey = `${imgName}_${rId}`;
                    let ann = rockAnnotationsMap[uniqueKey] || rock.annotation || rock.validation_status || 'pending';
                    let x = Math.round(rock.x || rock.xmin || rock.left || 0);
                    let y = Math.round(rock.y || rock.ymin || rock.top || 0);
                    
                    report += `- Rock #${rId}: ${ann} | BBox: [${x},${y}]\n`;
                    
                    let outlines = falseNegatives[imgName] || [];
                    if (outlines.length > 0) {
                        let outlineStr = outlines.map(pt => `[${pt.x},${pt.y}]`).join(', ');
                        report += `  Outline: ${outlineStr}\n`;
                    }
                });
                report += '\n';
            });
            return report;
        }

        function exportAnnotations() {
            const blob = new Blob([JSON.stringify(metadata, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'metadata.json';
            a.click();
        }

        function exportReport() {
            const blob = new Blob([generateReportText()], { type: 'text/plain' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'report.txt';
            a.click();
        }

        function openLiveReport() {
            document.getElementById('liveReportContent').textContent = generateReportText();
            document.getElementById('liveReportModal').style.display = 'flex';
        }

        function closeLiveReport() {
            document.getElementById('liveReportModal').style.display = 'none';
        }
    </script>
</body>
</html>
