<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Rocks Validator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #1e1e2f;
            color: #fff;
            margin: 0;
            padding: 20px;
        }
        /* Giriş Ekranı Modal Stili */
        #loginModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .login-card {
            background: #2a2a3c;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .login-card input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #1e1e2f;
            color: #fff;
            font-size: 16px;
        }
        .login-card button {
            padding: 10px;
            border-radius: 5px;
            border: none;
            background: #4f46e5;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .login-card button:hover {
            background: #4338ca;
        }
        #mainContent {
            display: none;
            text-align: center;
            margin-top: 50px;
        }
        .submit-btn {
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background: #059669;
        }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ MODALI (HTML) -->
    <div id="loginModal">
        <div class="login-card">
            <h2>🌙 Moon Rocks Validator</h2>
            <p>Lütfen adınızı ve soyadınızı girin.</p>
            <input type="text" id="userNameInput" placeholder="Ad Soyad (Örn: Ahmet Yılmaz)" autocomplete="off">
            <button onclick="handleUserLogin()">Sisteme Giriş Yap →</button>
        </div>
    </div>

    <!-- 2. ANA PANEL (Giriş Yapıldıktan Sonra Görünecek Kısım) -->
    <div id="mainContent">
        <h1 id="welcomeTitle"></h1>
        <p>Size atanan fotoğraflar yüklendi. İncelemeyi bitirince raporu Google Sheets'e gönderebilirsiniz.</p>
        
        <!-- Örnek Gönderim Butonu -->
        <button class="submit-btn" onclick="simulateReportSubmission()">Raporu Google Sheets'e Kaydet 📤</button>
    </div>

    <!-- JAVASCRIPT KISMI -->
    <script>
        let loggedInUser = "";
        const IMAGES_PER_USER = 1000; 

        // Giriş butonuna basıldığında çalışır
        function handleUserLogin() {
            const inputVal = document.getElementById('userNameInput').value.trim();
            if (!inputVal) {
                alert('Lütfen geçerli bir ad ve soyad girin!');
                return;
            }
            
            loggedInUser = inputVal;
            
            // Modal'ı gizle, ana içeriği göster
            document.getElementById('loginModal').style.display = 'none';
            document.getElementById('mainContent').style.display = 'block';
            document.getElementById('welcomeTitleinnerText').innerText = `Hoş geldin, ${loggedInUser}!`;
            
            // Kullanıcıya özel veri dağılımını tetikle
            initializeUserData();
        }

        // Kullanıcıya özel fotoğraf dilimleme mantığı
        function initializeUserData() {
            // Örnek 5000 elemanlı bir havuz simülasyonu
            let allImageKeys = [];
            for(let i = 1; i <= 5000; i++) {
                allImageKeys.push(`render${i}_original`);
            }
            
            let userHash = 0;
            for (let i = 0; i < loggedInUser.length; i++) {
                userHash += loggedInUser.charCodeAt(i);
            }
            
            let startIndex = (userHash * IMAGES_PER_USER) % allImageKeys.length;
            
            let imagesList = [];
            for (let i = 0; i < IMAGES_PER_USER; i++) {
                let idx = (startIndex + i) % allImageKeys.length;
                imagesList.push(allImageKeys[idx]);
            }

            console.log(`${loggedInUser} için atanan ilk fotoğraf: ${imagesList[0]}`);
            console.log(`${loggedInUser} için atanan toplam fotoğraf sayısı: ${imagesList.length}`);
        }

        // Google Sheets'e Rapor Gönderme Fonksiyonu (Senin URL'in ile güncellendi)
        function simulateReportSubmission() {
            const webAppUrl = "https://script.google.com/macros/s/AKfycbwifUwN3Y1C83OVik7xldfiPlk0Rqu2JCNXI95LXlTKb4SVzkLD5h33rl9fPi8AuvMLig/exec";

            // Senin örnek raporundan esinlenilmiş örnek veri paketi
            const sampleReportText = "MOON ROCKS SAM FALSE NEGATIVES REPORT\nImage: render3732_original\nTotal Model Rocks: 46\n- Rock #1: yes | BBox: [657,69]\n...";

            const payload = {
                userName: loggedInUser,
                imageName: "render3732_original",
                totalRocks: 46,
                detailsSummary: sampleReportText
            };

            // Butona basıldığında kullanıcıya bilgi verelim
            alert("Rapor Google Sheets'e gönderiliyor, lütfen bekleyin...");

            fetch(webAppUrl, {
                method: "POST",
                mode: "no-cors", // Google Apps Script CORS engelini aşmak için
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("✅ Rapor başarıyla Google Sheets tablonuza kaydedildi!");
            })
            .catch(error => {
                console.error("Hata:", error);
                alert("❌ Kayıt sırasında bir hata oluştu.");
            });
        }
    </script>
</body>
</html>
