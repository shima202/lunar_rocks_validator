<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moon Rocks Validator - Public</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1e1e2e;
            color: #e0e0e0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .container { max-width: 1400px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        .header { text-align: center; padding: 10px; background: rgba(255, 255, 255, 0.05); border-radius: 8px; border-left: 4px solid #ef4444; }
        .header h1 { font-size: 18px; color: #ef4444; }
        
        .quick-nav-bar {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .quick-nav-header { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .quick-nav-header select {
            background: #2a2a3c;
            color: #e0e0e0;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
        }
        .rock-shortcuts {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            max-height: 70px;
            overflow-y: auto;
            padding: 4px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .rock-chip {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: #e0e0e0;
            padding: 2px 6px;
            font-size: 10px;
            border-radius: 3px;
            cursor: pointer;
        }
        .rock-chip:hover { background: #ef4444; border-color: #ef4444; }
        .rock-chip.active { background: #22c55e; border-color: #22c55e; font-weight: bold; }

        .panel { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 6px; display: flex; flex-direction: column; overflow: hidden; }
        .panel-title { padding: 8px 12px; background: rgba(239, 68, 68, 0.15); font-weight: 600; font-size: 11px; color: #ef4444; }
        .panel-content { display: flex; align-items: center; justify-content: center; background: rgba(0, 0, 0, 0.3); position: relative; padding: 10px; overflow: auto; min-height: 250px; }
        #unifiedCanvas { max-width: 100%; height: auto; border-radius: 4px; }
        
        .controls-section { background: rgba(255, 255, 255, 0.05); padding: 12px; border-radius: 6px; display: flex; flex-direction: column; gap: 10px; }
        .nav-row { display: flex; gap: 10px; align-items: center; justify-content: space-between; }
        .rock-counter { color: #a0a0a0; font-size: 11px; font-weight: 600; }
        
        .validation-buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
        .validation-buttons button { padding: 10px; font-size: 12px; font-weight: 700; border: none; border-radius: 4px; cursor: pointer; text-transform: uppercase; color: white; }
        .btn-yes { background: #22c55e; }
        .btn-no { background: #ef4444; }
        .btn-review { background: #f59e0b; }
        .btn-prev, .btn-next { background: #6b7280; }
        .btn-export { width: 100%; padding: 10px; background: #3b82f6; color: white; border: none; border-radius: 4px; font-weight: 700; cursor: pointer; font-size: 12px; text-transform: uppercase; margin-top: 5px; }
        
        .info-panel { background: rgba(255, 255, 255, 0.05); padding: 8px 12px; border-radius: 6px; border-left: 3px solid #ef4444; font-size: 11px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .info-row { display: flex; gap: 6px; color: #a0a0a0; }
        .info-row strong { color: #e0e0e0; }
        .annotation-status { padding: 2px 6px; border-radius: 10px; font-size: 10px; font-weight: 600; }
        .status-yes { background: rgba(76, 175, 80, 0.2); color: #4ade80; }
        .status-no { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
        .status-review { background: rgba(245, 158, 11, 0.2); color: #f59e0b; }
        .status-pending { background: rgba(107, 114, 128, 0.2); color: #d1d5db; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 Moon Rocks Validator (Public)</h1>
        </div>

        <div class="quick-nav-bar">
            <div class="quick-nav-header">
                <span style="font-size: 11px; font-weight: 600; color: #ef4444;">Görsel Seçimi:</span>
                <select id="imageSelector" onchange="onImageSelectorChange(this.value)"></select>
            </div>
            <div style="font-size: 10px; color: #a0a0a0;">Mevcut Görselin Taş Kısayolları:</div>
            <div class="rock-shortcuts" id="rockShortcutsContainer"></div>
        </div>

        <div class="panel">
            <div class="panel-title">Interactive Validation Window (Target Isolated Outline Zoom)</div>
            <div class="panel-content">
                <canvas id="unifiedCanvas"></canvas>
            </div>
        </div>

        <div class="controls-section">
            <div class="nav-row">
                <div class="rock-counter">
                    Image: <span id="currentImageName">-</span> | Rock <span id="currentRockNum">1</span> / <span id="totalRocks">0</span>
                </div>
            </div>

            <div class="validation-buttons">
                <button class="btn-yes" onclick="annotateRock('yes')">✓ YES</button>
                <button class="btn-no" onclick="annotateRock('no')">✗ NO</button>
                <button class="btn-review" onclick="annotateRock('review')">⟳ REVIEW</button>
                <button class="btn-prev" onclick="previousRock()">← PREV</button>
                <button class="btn-next" onclick="nextRock()">NEXT →</button>
            </div>

            <div class="info-panel">
                <div class="info-row"><strong>Rock #:</strong> <span id="rockId">-</span></div>
                <div class="info-row"><strong>BBox:</strong> <span id="rockCoords">-</span></div>
                <div class="info-row"><strong>Status:</strong> <span id="annotationStatus" class="annotation-status status-pending">PENDING</span></div>
            </div>

            <div>
                <button class="btn-export" onclick="exportReport()">📥 Değerlendirme Raporunu İndir (Export)</button>
            </div>
        </div>
    </div>

    <script>
        let allRocks = [];
        let currentRockIndex = 0;
        let imagesList = [];

        window.onload = async function() {
            try {
                let response = await fetch('data.json');
                let parsedData = await response.json();
                
                allRocks = [];
                imagesList = Object.keys(parsedData);

                imagesList.forEach(imgName => {
                    let imgObj = parsedData[imgName];
                    let rocksArray = imgObj.rocks || imgObj.annotations || [];
                    rocksArray.forEach((rock, rockIdx) => {
                        allRocks.push({ 
                            imageName: imgName, 
                            rockIndex: rockIdx, 
                            rawUrl: imgObj.raw_url, 
                            maskedUrl: imgObj.masked_url, 
                            ...rock 
                        });
                    });
                });

                if (allRocks.length > 0) {
                    populateImageSelector(imagesList);
                    document.getElementById('totalRocks').textContent = allRocks.length;
                    displayCurrentRock();
                } else {
                    alert('Kaya verisi bulunamadı.');
                }
            } catch (error) {
                console.error('Veri yüklenemedi:', error);
                alert('data.json dosyası okunamadı! (Not: Bilgisayarda test ediyorsanız tarayıcı CORS engeline takılıyor olabilir, GitHub Pages üzerinden sorunsuz çalışacaktır.)');
            }
        };

        function populateImageSelector(images) {
            const selector = document.getElementById('imageSelector');
            selector.innerHTML = '';
            images.forEach(imgName => {
                const opt = document.createElement('option');
                opt.value = imgName;
                opt.textContent = imgName;
                selector.appendChild(opt);
            });
        }

        function updateRockShortcuts(currentImgName) {
            const container = document.getElementById('rockShortcutsContainer');
            container.innerHTML = '';
            
            const rocksOfImage = allRocks.map((r, idx) => ({ ...r, globalIdx: idx })).filter(r => r.imageName === currentImgName);
            
            rocksOfImage.forEach(r => {
                const chip = document.createElement('div');
                chip.className = 'rock-chip';
                if (r.globalIdx === currentRockIndex) chip.classList.add('active');
                chip.textContent = `#${r.id || (r.rockIndex + 1)}`;
                chip.onclick = () => {
                    currentRockIndex = r.globalIdx;
                    displayCurrentRock();
                };
                container.appendChild(chip);
            });
        }

        function onImageSelectorChange(imgName) {
            const targetIndex = allRocks.findIndex(r => r.imageName === imgName);
            if (targetIndex !== -1) {
                currentRockIndex = targetIndex;
                displayCurrentRock();
            }
        }

        function displayCurrentRock() {
            if (!allRocks || allRocks.length === 0) return;
            const rock = allRocks[currentRockIndex];
            const imgName = rock.imageName;

            document.getElementById('currentRockNum').textContent = currentRockIndex + 1;
            document.getElementById('currentImageName').textContent = imgName;
            document.getElementById('imageSelector').value = imgName;

            updateRockShortcuts(imgName);
            updateRockInfo(rock);

            const canvas = document.getElementById('unifiedCanvas');
            const ctx = canvas.getContext('2d');

            const img = new Image();
            img.crossOrigin = "anonymous";
            img.onload = function() {
                canvas.width = img.width;
                canvas.height = img.height;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0);

                let sX = rock.x || rock.xmin || 0;
                let sY = rock.y || rock.ymin || 0;
                let sW = rock.width || 50;
                let sH = rock.height || 50;

                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 3;
                ctx.strokeRect(sX, sY, sW, sH);
            };
            img.src = rock.rawUrl || rock.maskedUrl;
        }

        function updateRockInfo(rock) {
            document.getElementById('rockId').textContent = rock.id || (currentRockIndex + 1);
            let x = Math.round(rock.x || rock.xmin || 0);
            let y = Math.round(rock.y || rock.ymin || 0);
            let w = Math.round(rock.width || 0);
            let h = Math.round(rock.height || 0);
            document.getElementById('rockCoords').textContent = `[${x}, ${y}] ${w}×${h}`;

            const statusEl = document.getElementById('annotationStatus');
            statusEl.className = 'annotation-status';
            const ann = rock.validation_status;
            if (ann === 'yes') { statusEl.classList.add('status-yes'); statusEl.textContent = '✓ YES'; }
            else if (ann === 'no') { statusEl.classList.add('status-no'); statusEl.textContent = '✗ NO'; }
            else if (ann === 'review') { statusEl.classList.add('status-review'); statusEl.textContent = '⟳ REVIEW'; }
            else { statusEl.classList.add('status-pending'); statusEl.textContent = 'PENDING'; }
        }

        function annotateRock(value) {
            if (!allRocks || currentRockIndex >= allRocks.length) return;
            allRocks[currentRockIndex].validation_status = value;
            updateRockInfo(allRocks[currentRockIndex]);
            updateRockShortcuts(allRocks[currentRockIndex].imageName);
            setTimeout(() => nextRock(), 150);
        }

        function nextRock() {
            if (currentRockIndex < allRocks.length - 1) {
                currentRockIndex++;
                displayCurrentRock();
            }
        }

        function previousRock() {
            if (currentRockIndex > 0) {
                currentRockIndex--;
                displayCurrentRock();
            }
        }

        function exportReport() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(allRocks, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "user_validation_report.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }
    </script>
</body>
</html>
